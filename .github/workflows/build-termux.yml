name: Build Termux Native Binary

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-termux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (ARM64 Emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build inside Termux Container
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -v "${{ github.workspace }}:/builder/workspace" \
            -w /builder/workspace \
            ghcr.io/termux/termux-docker:aarch64 \
            bash -c "
              pkg update -y && \
              pkg install -y rust binutils clang cmake make git protobuf openssl libsqlite && \
              cd codex-rs && \
              cargo build --release -p codex-cli && \
              strip target/release/codex
            "

      - name: Package Binary
        run: |
          cd codex-rs/target/release
          tar -czvf codex-aarch64-termux.tar.gz codex

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-aarch64-termux
          path: codex-rs/target/release/codex-aarch64-termux.tar.gz
          retention-days: 7
